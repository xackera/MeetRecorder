<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meet Recorder — доступ к микрофону</title>
    <style>
      body {
        font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        max-width: 520px;
        margin: 60px auto;
        padding: 0 24px;
        color: #202124;
        line-height: 1.5;
      }
      h1 { font-size: 20px; }
      .box {
        border: 1px solid #dadce0;
        border-radius: 12px;
        padding: 20px 24px;
        margin-top: 16px;
      }
      .status { font-size: 15px; margin-top: 12px; font-weight: 600; }
      .ok { color: #188038; }
      .err { color: #d93025; }
      .muted { color: #5f6368; font-size: 14px; }
      button {
        margin-top: 16px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        background: #1a73e8;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>🎤 Доступ к микрофону</h1>
    <div class="box">
      <p class="muted">
        Расширению нужен доступ к микрофону, чтобы записывать ваш голос вместе
        со звуком встречи. Разрешите доступ — это делается один раз.
      </p>
      <button id="askBtn">Разрешить доступ к микрофону</button>
      <div class="status" id="status"></div>
      <p class="muted" id="next" style="display:none">
        ✅ Готово. Вернитесь на вкладку с Google Meet и нажмите
        «Начать запись» в окне расширения. Эту вкладку можно закрыть.
      </p>
    </div>
    <script src="permission.js"></script>
  </body>
</html>
